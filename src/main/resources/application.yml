spring:
  application:
    name: assignment

  datasource:
    url: jdbc:mysql://localhost:3306/assignment
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 1800000 # 30분 (ms)
  refresh-token-expiration: 1209600000 # 14일 (ms)